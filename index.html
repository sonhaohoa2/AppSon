<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHẬU CÙNG AI - TEAM SALES TT HÀ NỘI</title>
    <!-- Thêm thư viện QRCode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        .qr-container {
            text-align: center;
            margin-top: 15px;
        }
        .qr-container img {
            max-width: 250px;
            height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>NHẬU CÙNG AI - SALES TT HÀ NỘI</h2>
    <form id="billForm">
        <div class="form-group">
            <label for="billTotal">Tổng hóa đơn (VNĐ):</label>
            <input type="number" id="billTotal" placeholder="Nhập tổng số tiền" required>
        </div>
        <div class="form-group">
            <label for="peopleCount">Số người chia:</label>
            <input type="number" id="peopleCount" placeholder="Nhập số người" required>
        </div>
        <div class="form-group">
            <label for="serviceFee">Phí dịch vụ / Phát sinh (VNĐ):</label>
            <input type="number" id="serviceFee" value="0">
        </div>
        <div class="form-group">
            <label for="bankSelect">Ngân hàng nhận tiền:</label>
            <select id="bankSelect">
                <option value="MB">MBBank</option>
                <option value="VCB">Vietcombank</option>
                <option value="TCB">Techcombank</option>
                <option value="ACB">ACB</option>
                <option value="VPB">VPBank</option>
            </select>
        </div>
        <div class="form-group">
            <label for="accountNo">Số tài khoản:</label>
            <input type="text" id="accountNo" placeholder="Nhập số tài khoản nhận" required>
        </div>
        <div class="form-group">
            <label for="accountName">Tên chủ tài khoản:</label>
            <input type="text" id="accountName" placeholder="TÊN CHỦ TÀI KHOẢN" required>
        </div>
        <button type="button" onclick="calculateMoney()">TÍNH TIỀN & TẠO MA QR</button>
    </form>

    <div class="result" id="resultBlock" style="display:none;">
        <h3>Kết quả chia tiền:</h3>
        <p>Mỗi người cần trả: <strong id="perPersonAmount" style="color: #d9534f; font-size: 1.2em;">0</strong> VNĐ</p>
        <div class="qr-container">
            <h4>Mã VietQR chuyển khoản:</h4>
            <img id="qr-img" src="" alt="Mã VietQR">
        </div>
    </div>
</div>

<script>
function calculateMoney() {
    // 1. Lấy dữ liệu đầu vào
    const billTotal = parseFloat(document.getElementById('billTotal').value) || 0;
    const peopleCount = parseInt(document.getElementById('peopleCount').value) || 0;
    const serviceFee = parseFloat(document.getElementById('serviceFee').value) || 0;
    
    const bank = document.getElementById('bankSelect').value;
    const accountNo = document.getElementById('accountNo').value.trim();
    const accountName = document.getElementById('accountName').value.trim();

    // Kiểm tra dữ liệu hợp lệ
    if (peopleCount <= 0) {
        alert('Vui lòng nhập số người lớn hơn 0!');
        return;
    }
    if (!accountNo) {
        alert('Vui lòng nhập số tài khoản!');
        return;
    }

    // 2. Tính toán số tiền mỗi người
    const totalAmount = billTotal + serviceFee;
    const rawPerPerson = totalAmount / peopleCount;
    
    // Làm tròn lên đến hàng nghìn gần nhất (ví dụ: 102.300 -> 103.000)
    const perPerson = Math.ceil(rawPerPerson / 1000) * 1000;

    // 3. Hiển thị kết quả
    document.getElementById('perPersonAmount').innerText = perPerson.toLocaleString('vi-VN');
    document.getElementById('resultBlock').style.display = 'block';

    // 4. Tạo mã VietQR tự động thông qua VietQR API
    const addInfo = encodeURIComponent('Nhan cung AI TT Ha Noi');
    const encodedAccountName = encodeURIComponent(accountName);
    const qrUrl = `https://img.vietqr.io/image/${bank}-${accountNo}-compact2.png?amount=${perPerson}&addInfo=${addInfo}&accountName=${encodedAccountName}`;

    document.getElementById('qr-img').src = qrUrl;
}
</script>

</body>
</html>
